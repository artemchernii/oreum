# Dependency updates.
#
# The first configuration grouped too little and opened eight PRs at once —
# ungrouped minor bumps alongside majors. Everything routine now lands in a
# single PR per ecosystem per month.
#
# Majors are deliberately left ungrouped. CI runs `pnpm check` but not
# `pnpm build`, so a major compiler or framework bump can break the production
# build without CI noticing; each one needs its own build check before it
# merges. TypeScript 6 was verified exactly that way.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR for everything routine.
      all-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the Node runtime, not the newest published types.
      # CI and Vercel both run Node 24, so a major bump here reintroduces the
      # runtime/types mismatch rather than fixing anything. Raise this when the
      # runtime moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
