name: CI

on:
  pull_request:
  push:
    branches: [master]

# A newer push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json#packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No `build` step here on purpose: Vercel builds every PR already, and
      # `next build` runs TypeScript. Duplicating it burns minutes for a
      # signal that is reported on the PR anyway. What Vercel does NOT run is
      # eslint — removed from `next build` in Next 16 — or markdownlint.
      - run: pnpm check
